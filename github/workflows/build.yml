name: Build NetBeacon for Windows

# Runs on every push / pull request, on tags like v1.0.0, and on demand (Actions tab > Run workflow).
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also publish the files on the Releases page"
        type: boolean
        default: false

permissions:
  contents: write        # needed to create releases

env:
  PYTHON_VERSION: "3.12"
  SIMPLEMONITOR_VERSION: "1.15.0"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # SimpleMonitor on its own: its optional heavy libraries (boto3, twilio, ...) are not needed
          pip install --no-deps "simplemonitor==$env:SIMPLEMONITOR_VERSION"
          pip list

      - name: Run the tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider

      - name: Build the one-file executable (NetBeacon.exe)
        shell: pwsh
        run: pyinstaller --noconfirm --clean netbeacon.spec

      - name: Build the one-folder version
        shell: pwsh
        env:
          NB_ONEDIR: "1"
        run: |
          pyinstaller --noconfirm --clean --distpath dist-folder --workpath build-folder netbeacon.spec
          Compress-Archive -Path dist-folder\NetBeacon -DestinationPath dist\NetBeacon-folder.zip

      - name: Self-test the finished .exe (real engine + every GUI page)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\NetBeacon.exe" -ArgumentList "--selftest","selftest-onefile.json" -Wait -PassThru
          Get-Content selftest-onefile.json
          if ($p.ExitCode -ne 0) { throw "Self-test of NetBeacon.exe failed (exit code $($p.ExitCode))" }
          $p2 = Start-Process -FilePath "dist-folder\NetBeacon\NetBeacon.exe" -ArgumentList "--selftest","selftest-folder.json" -Wait -PassThru
          Get-Content selftest-folder.json
          if ($p2.ExitCode -ne 0) { throw "Self-test of the folder build failed (exit code $($p2.ExitCode))" }

      - name: Upload the build (find it at the bottom of the run's Summary page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetBeacon-windows
          path: |
            dist/NetBeacon.exe
            dist/NetBeacon-folder.zip
            selftest-*.json
          if-no-files-found: warn
          retention-days: 30

      # ---------- Releases (so you can download without hunting for artifacts) ----------
      - name: Publish a versioned release (tags like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NetBeacon.exe
            dist/NetBeacon-folder.zip
          generate_release_notes: true

      - name: Publish / refresh the rolling "latest-build" pre-release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest-build *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete latest-build --cleanup-tag --yes }
          gh release create latest-build dist/NetBeacon.exe dist/NetBeacon-folder.zip `
            --prerelease --target $env:GITHUB_SHA `
            --title "Latest build" `
            --notes "Automatic build of commit $env:GITHUB_SHA. Download NetBeacon.exe (single file) or NetBeacon-folder.zip (unzip and run NetBeacon\NetBeacon.exe)."
